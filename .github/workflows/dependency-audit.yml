name: Dependency audit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect doc-only changes
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            tip="${{ github.sha }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base="${{ github.event.before }}"
            tip="${{ github.sha }}"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$base" "$tip" -- . ':!*.md' ':!*.mdx' ':!**/*.md' ':!docs/**' | grep -q .; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.filter.outputs.docs_only == 'true'
        run: echo "Doc-only change; passing quickly."
      - uses: actions/setup-node@v4
        if: steps.filter.outputs.docs_only != 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.filter.outputs.docs_only != 'true'
      # Upstream intuit-oauth still carries a moderate, no-fix advisory through
      # query-string/decode-uri-component. Block high and critical regressions.
      - run: npm audit --omit=dev --audit-level=high
        if: steps.filter.outputs.docs_only != 'true'
